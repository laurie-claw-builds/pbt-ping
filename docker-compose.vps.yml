services:
  pbt-ping-api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: pbt-ping-api
    restart: unless-stopped
    env_file:
      - ./deploy/env/api.env
    expose:
      - "3000"
    networks:
      - stageflow_default
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  pbt-ping-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: pbt-ping-web
    restart: unless-stopped
    env_file:
      - ./deploy/env/web.env
    expose:
      - "5000"
    networks:
      - stageflow_default
    depends_on:
      pbt-ping-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  stageflow_default:
    external: true
